name: Build & Release Beatles APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.2)'
        required: true
        default: 'v1.2'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.2"
          fi
          echo "Releasing for tag $TAG"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk#Beatles-App.apk \
            --title "Beatles $TAG" \
            --notes "### Beatles $TAG Update
          - Smooth 120 FPS album morph without distortion
          - Fixed back gesture navigation on artist page
          - Complete artist discography & strict artist purity
          - Faster playback with studio audio quality" \
            --clobber
